          <p class="text-base">Bidang <strong>Teknik Jaringan Komputer dan Telekomunikasi (TJKT)</strong> tidak hanya berfokus pada penguasaan teknis, tetapi juga pada bagaimana teknologi tersebut diterapkan dalam ekosistem bisnis modern serta mengutamakan keselamatan kerja.</p>
          
          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Alur Kerja & Proses Bisnis Industri TJKT</h3>
          <p>Proses bisnis di bidang TJKT mencakup rangkaian kegiatan terencana untuk merancang, membangun, dan mengelola infrastruktur TI bagi klien atau perusahaan:</p>
          <ul class="list-disc pl-5 space-y-2 my-2">
            <li><strong>Perencanaan & Analisis Kebutuhan (Requirement Analysis):</strong> Mengidentifikasi jumlah pengguna, cakupan area jaringan, estimasi kebutuhan bandwidth, dan bujet klien.</li>
            <li><strong>Perancangan Arsitektur (Network Design):</strong> Membuat topologi jaringan (Logical & Physical Design) serta menentukan spesifikasi perangkat keras/lunak.</li>
            <li><strong>Pengadaan & Penggelaran (Deployment):</strong> Melakukan instalasi kabel, mounting server, konfigurasi router/switch, dan pengujian konektivitas.</li>
            <li><strong>Pemeliharaan & Layanan (Maintenance & Support):</strong> Monitoring ketersediaan jaringan (*uptime*), penanganan gangguan (*troubleshooting*), dan update sistem berkala.</li>
          </ul>

            <ul class="list-disc pl-5 space-y-1">
              <li><strong>Alat Pelindung Diri (APD):</strong> Menggunakan helm keselamatan, sabuk pengaman (*full-body harness*) saat memanjat tower telekomunikasi, sepatu *safety* anti-statis, dan sarung tangan isolasi.</li>
              <li><strong>Pencegahan Electrostatic Discharge (ESD):</strong> Menggunakan gelang anti-statis (*anti-static wrist strap*) saat memegang motherboard atau modul RAM agar arus statis tubuh tidak merusak sirkuit mikro.</li>
              <li><strong>Manajemen Kabel & Ergonomi:</strong> Menata kabel jaringan (*cable management*) menggunakan ducting/cable tray agar tidak menyebabkan bahaya tersandung, serta mengatur posisi duduk ergonomis di depan komputer.</li>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Anatomi Komponen Utama PC</h3>
          <ul class="list-disc pl-5 space-y-2 my-2">
            <li><strong>Processor (CPU):</strong> Otak utama pemroses data. Memiliki spesifikasi kecepatan clock (GHz), jumlah core, serta cache memory.</li>
            <li><strong>Motherboard:</strong> Papan sirkuit utama tempat menghubungkan seluruh komponen via socket CPU, slot RAM, PCIe slot, dan chipset.</li>
            <li><strong>RAM (Random Access Memory):</strong> Memori penyimpanan sementara berkecepatan tinggi tempat data program berjalan disimpan.</li>
            <li><strong>Media Penyimpanan (Storage):</strong> Menyimpan data secara permanen. Berupa <em>HDD (Hard Disk Drive)</em> mekanis, <em>SATA SSD</em>, atau <em>NVMe M.2 SSD</em> yang menggunakan jalur PCIe ultra-cepat.</li>
            <li><strong>Power Supply Unit (PSU):</strong> Mengubah arus AC dari listrik PLN menjadi arus DC berkekuatan stabil (3.3V, 5V, 12V) untuk menyuplai daya ke komponen.</li>
          </ul>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">2. Langkah-Langkah Perakitan PC Standar Industri</h3>
          <ol class="list-decimal pl-5 space-y-2 my-3">
            <li><strong>Persiapan:</strong> Gunakan gelang anti-statis dan siapkan obeng presisi. Letakkan motherboard di alas non-konduktif.</li>
            <li><strong>Pemasangan Processor & Cooler:</strong> Buka tuas socket CPU, sejajarkan indikator segitiga processor dengan socket, kunci tuas. Aplikasikan <em>thermal paste</em> tipis dan pasang heatsink/fan cooler.</li>

            <li><strong>Pengujian POST (Power-On Self-Test):</strong> Hubungkan monitor dan sumber daya, hidupkan komputer untuk memastikan BIOS/UEFI mendeteksi seluruh hardware dengan baik.</li>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Jenis & Klasifikasi Sistem Operasi</h3>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Klasifikasi Jaringan Berdasarkan Area Geografis</h3>
          <ul class="list-disc pl-5 space-y-1 text-sm my-2">
            <li><strong>PAN (Personal Area Network):</strong> Jaringan perorangan dalam jangkauan < 10 meter (contoh: Bluetooth, NFC).</li>
            <li><strong>LAN (Local Area Network):</strong> Jaringan lokal terbatas satu gedung/ruangan (contoh: Lab Sekolah, Kantor).</li>
            <li><strong>MAN (Metropolitan Area Network):</strong> Jaringan yang menghubungkan antar gedung dalam satu kota (10-50 km).</li>
            <li><strong>WAN (Wide Area Network):</strong> Jaringan lintas negara/benua yang terhubung melalui kabel laut atau satelit.</li>

          <div class="p-4 bg-gray-100 dark:bg-black/40 rounded-lg border-l-4 border-blue-500 my-4">

            <li><strong>Cross-Over:</strong> Ujung satu T568A, ujung lainnya T568B. Digunakan untuk menghubungkan <em>dua perangkat sejenis</em> (contoh: PC ke PC, Switch ke Switch).</li>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Alat Ukur Utama dalam TJKT</h3>

          <p class="text-base">Administrasi Infrastruktur Jaringan (AIJ) membahas pengaturan perangkat keras pengarah jaringan skala menengah hingga besar seperti Managed Switch dan Enterprise Router.</p>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Virtual LAN (VLAN) & Trunking</h3>
          <p><strong>VLAN</strong> digunakan untuk membagi satu jaringan fisik switch menjadi beberapa domain siaran (broadcast domain) terpisah secara logis. Hal ini meningkatkan keamanan dan efisiensi jaringan.</p>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 my-4">

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Teknologi Nirkabel & Wi-Fi Industri</h3>
          <p>Komunikasi nirkabel berbasis standar **IEEE 802.11** menggunakan dua frekuensi radio utama:</p>
          <ul class="list-disc pl-5 space-y-1 text-sm my-2">
            <li><strong>Frekuensi 2.4 GHz:</strong> Memiliki jangkauan sinyal lebih jauh dan penetrasi tembok yang baik, tetapi rawan interferensi karena salurannya padat.</li>
            <li><strong>Frekuensi 5 GHz:</strong> Memiliki throughput bandwidth jauh lebih cepat dan sedikit interferensi, tetapi jangkauan jaraknya lebih pendek.</li>
          </ul>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">2. Arsitektur Jaringan Wireless Outdoor</h3>
          <ul class="list-disc pl-5 space-y-2 my-2">
            <li><strong>Point-to-Point (PTP):</strong> Menghubungkan 2 lokasi gedung/tower secara khusus menggunakan antena direktional berdaya jangkau jauh (seperti antena Dish atau Grid).</li>
            <li><strong>Point-to-Multipoint (PTMP):</strong> Satu stasiun pemancar pusat (*Base Station / Omni Antenna*) memancarkan sinyal ke banyak lokasi penerima (*Client/CPE*).</li>
          </ul>
        `
      },
      {
        title: "9. Keamanan Jaringan & Cyber Security",
        badge: "Kelas 11 (Fase F - Konsentrasi)",
        content: `
          <p class="text-base">Di era digital, infrastruktur jaringan sangat rentan terhadap serangan siber. Keamanan jaringan bertugas menjaga integritas, kerahasiaan (*confidentiality*), dan ketersediaan (*availability*) data.</p>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Implementasi Firewall & NAT</h3>
          <p><strong>Firewall</strong> bertindak sebagai garda depan pengaman lalu lintas data dengan memeriksa setiap paket berdasarkan aturan (*rules*):</p>
          <ul class="list-disc pl-5 space-y-1 text-sm my-2">
            <li><strong>Filtering Rules:</strong> Mengizinkan (*Accept*), menolak (*Reject*), atau membuang (*Drop*) paket data berdasarkan IP Asal, IP Tujuan, Port, atau Protokol.</li>
            <li><strong>NAT (Network Address Translation):</strong> Mentranslasikan alamat IP Privat jaringan lokal menjadi alamat IP Publik agar bisa mengakses internet, serta menyembunyikan struktur IP internal dari publik.</li>
          </ul>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">2. Enkripsi & Virtual Private Network (VPN)</h3>
          <p><strong>VPN</strong> membuat jalur pipa privat terenkripsi (*encrypted tunnel*) di atas jaringan publik internet. Menggunakan protokol seperti L2TP/IPsec, OpenVPN, atau WireGuard untuk menghubungkan pekerja jarak jauh ke jaringan internal kantor secara aman.</p>
        `
      },

      {

        badge: "Kelas 12 (Fase F - Pendalaman)",
        content: `
          <p class="text-base">Materi tingkat lanjut untuk mengoptimalkan penggunaan kapasitas pipa data (bandwidth) dan menjamin kestabilan jaringan internet skala besar.</p>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Manajemen Bandwidth (Quality of Service - QoS)</h3>
          <p>Teknik pembagian kuota kecepatan internet agar setiap pengguna mendapatkan alokasi adil dan mencegah lalu lintas data yang berlebihan:</p>
          <ul class="list-disc pl-5 space-y-2 my-2">
            <li><strong>Simple Queue:</strong> Cara paling sederhana untuk membatasi *Upload/Download* berdasarkan IP Address atau subnet tertentu.</li>
            <li><strong>Queue Tree & HTB (Hierarchical Token Bucket):</strong> Pengelompokan bandwidth secara bertingkat berdasarkan prioritas paket data (contoh: memprioritaskan paket *Game Online* dan *Zoom Meeting* di atas paket *Download Torrent*).</li>
          </ul>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">2. Load Balancing & Redundancy</h3>
          <p>Menggabungkan dua atau lebih jalur koneksi ISP (Internet Service Provider) menggunakan metode seperti <strong>PCC (Per Connection Classifier)</strong> untuk membagi beban trafik secara seimbang, serta fitur <strong>Failover</strong> otomatis jika salah satu koneksi ISP terputus.</p>
        `
      },
      {
        title: "11. ASJ Lanjutan & Troubleshooting",
        badge: "Kelas 12 (Fase F - Pendalaman)",
        content: `

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Layanan Server Lanjutan</h3>
          <ul class="list-disc pl-5 space-y-2 my-2">
            <li><strong>Mail Server & Webmail:</strong> Membangun server email mandiri berbasis SMTP (Postfix) untuk pengiriman email, IMAP/POP3 (Dovecot) untuk penerimaan, dan tampilan antarmuka webmail (Roundcube).</li>
            <li><strong>Database Server Cluster & Backup:</strong> Konfigurasi replikasi database (Master-Slave) untuk redundansi data dan penjadwalan otomatis perintah <code>mysqldump</code> via *Cron Job*.</li>
          </ul>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">2. Metodologi Troubleshooting Server</h3>
          <div class="p-4 bg-gray-100 dark:bg-black/40 rounded-lg border-l-4 border-blue-500 my-4">
            <p class="font-bold mb-1">Langkah Deteksi Masalah Sistem:</p>
            <ol class="list-decimal pl-5 space-y-1 text-xs font-mono">
              <li>Pemeriksaan status service: <code>systemctl status name-service</code></li>
              <li>Analisis log error real-time: <code>journalctl -xe</code> atau <code>tail -f /var/log/syslog</code></li>
              <li>Pengujian alokasi sumber daya memori dan CPU: <code>htop</code> atau <code>top</code></li>
              <li>Pemeriksaan port terbuka: <code>netstat -tulpn</code> atau <code>ss -tulpn</code></li>
            </ol>
          </div>
        `
      },
      {
        title: "12. Teknologi Layanan Jaringan (VoIP & Fiber Optic)",
        badge: "Kelas 12 (Fase F - Pendalaman)",
        content: `
          <p class="text-base">Mempelajari integrasi jaringan telepon suara digital berbasis IP serta infrastruktur fisik transmisi cahaya menggunakan kabel Serat Optik (Fiber Optic).</p>

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Voice over IP (VoIP)</h3>
          <p>VoIP memungkinkan transmisi percakapan suara melalui jaringan IP digital, menggantikan jaringan telepon analog tradisional (PSTN):</p>
          <ul class="list-disc pl-5 space-y-1 text-sm my-2">
            <li><strong>Protokol SIP (Session Initiation Protocol):</strong> Protokol penyiapan dan pembubaran sesi komunikasi suara/video.</li>
            <li><strong>Server IP-PBX (Asterisk / FreePBX):</strong> Server pusat pembagi ekstensi nomor telepon digital ke perangkat *Softphone* (aplikasi HP/PC) atau *IP Phone*.</li>

        content: `

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">1. Peluang Usaha Bisnis TJKT</h3>
          <ul class="list-disc pl-5 space-y-2 my-2">

          <h3 class="text-lg font-bold text-blue-500 mt-6 mb-2">2. Penyusunan RAB & Dokumentasi Proyek</h3>
          <p>Setiap proyek wajib dilengkapi dengan <strong>Rencana Anggaran Biaya (RAB)</strong> yang memperhitungkan biaya modal awal (*CAPEX - Capital Expenditure*) seperti pembelian router/kabel, serta biaya operasional (*OPEX - Operational Expenditure*). Selain itu, teknisi menyusun dokumen **SLA (Service Level Agreement)** sebagai bentuk jaminan garansi ketersediaan layanan kepada konsumen.</p>

    let currentMateriIndex = 0;

    function renderTabs() {
      const tabsContainer = document.getElementById('materi-tabs');
      tabsContainer.innerHTML = '';
      materiList.forEach((m, idx) => {
        const btn = document.createElement('button');
        btn.className = `px-3 py-1.5 rounded text-xs font-mono border whitespace-nowrap transition ${idx === currentMateriIndex ? 'bg-blue-500 text-white border-blue-500 font-bold' : 'border-gray-300 dark:border-white/10 hover:bg-blue-500/10'}`;
        btn.textContent = `${idx + 1}. ${m.title.split('. ')[1] || m.title}`;
        btn.onclick = () => loadMateri(idx);
        tabsContainer.appendChild(btn);
      });
    }

    function loadMateri(index) {
      currentMateriIndex = index;
      const data = materiList[index];

      document.getElementById('materi-step-indicator').textContent = `Materi ${index + 1} dari ${materiList.length}`;
      document.getElementById('materi-badge').textContent = data.badge;
      document.getElementById('materi-title').textContent = data.title;
      document.getElementById('materi-body').innerHTML = data.content;

      // Handle button disabled state
      document.getElementById('prev-materi-btn').disabled = (index === 0);
      document.getElementById('prev-materi-btn').style.opacity = (index === 0) ? '0.5' : '1';

      const nextBtn = document.getElementById('next-materi-btn');
      if (index === materiList.length - 1) {
        nextBtn.innerHTML = `<span>Selesai Belajar</span> <i class="fas fa-check text-xs"></i>`;
      } else {
        nextBtn.innerHTML = `<span>Materi Selanjutnya</span> <i class="fas fa-arrow-right text-xs"></i>`;
      }

      renderTabs();
      window.scrollTo({ top: 200, behavior: 'smooth' });
    }

    function nextMateri() {
      if (currentMateriIndex < materiList.length - 1) {
        loadMateri(currentMateriIndex + 1);
      } else {
        alert("Selamat! Kamu telah menyelesaikan seluruh modul pembelajaran TJKT.");
      }
    }

    function prevMateri() {
      if (currentMateriIndex > 0) {
        loadMateri(currentMateriIndex - 1);
      }
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      loadMateri(0);
    });
  </script>
